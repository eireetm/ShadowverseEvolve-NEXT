; The online server's relay for the end-to-end tests of "use the server" (playwright.config.ts starts it): plain ws:// on
; this machine, three spectator seats a room, and a key for the tests only.
[server]
name = e2e
address = ws://127.0.0.1:5198
port = 5198
listen = 127.0.0.1

[rooms]
spectators = 3

[records]
; The games kept, here (packages/gui/.e2e-relay-records/, not in the repository).
dir = .e2e-relay-records

[keys]
e2e = e2e-test-key-0001

[limits]
; Every page of the tests comes from this machine: more connections from one address than a real server allows (a page
; at the online screen follows the lobby, and one in a room has its room's connection too).
max_connections_per_ip = 500
