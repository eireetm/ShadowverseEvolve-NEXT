; A second online server's relay for the end-to-end tests of several servers ("use the server" with two of them,
; playwright.config.ts starts it): another group's server — plain ws:// on this machine, two spectator seats a room, its
; own key, and no games kept.
[server]
name = friends
address = ws://127.0.0.1:5197
port = 5197
listen = 127.0.0.1

[rooms]
spectators = 2

[records]
enabled = no

[keys]
friends = e2e-test-key-0002

[limits]
; Every page of the tests comes from this machine (see relay.ini).
max_connections_per_ip = 500
