<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app speaks three languages itself: a browser translating the page changes it under React, which breaks it. -->
    <meta name="google" content="notranslate" />
    <title>SVE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='2' width='20' height='28' rx='3' fill='%23c9a227'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // In the Android or iOS app, when the app's code can't even be read (a syntax error before main.tsx starts: a web view
      // too old for it), show the page that says so rather than a blank screen. Old JavaScript, on purpose.
      window.addEventListener("error", function (e) {
        if (window.sveStarted || !window.Capacitor || !/SyntaxError/.test(String(e && e.message))) return;
        location.replace("/webview-old.html");
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
